<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#111827"/>

  <!-- Three converging signal waves -->
  <!-- Signal 1 -->
  <path d="M50,256 Q150,140 256,256 T462,256"
        fill="none" stroke="url(#brandGrad)" stroke-width="12"
        stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- Signal 2 (stronger, center) -->
  <path d="M40,256 Q140,350 256,256 T472,256"
        fill="none" stroke="url(#brandGrad)" stroke-width="14"
        stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Signal 3 -->
  <path d="M60,256 Q170,180 256,256 T442,256"
        fill="none" stroke="url(#brandGrad)" stroke-width="8"
        stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Center decision point -->
  <circle cx="256" cy="256" r="20" fill="url(#brandGrad)" opacity="0.95"/>
  <circle cx="256" cy="256" r="40" fill="none" stroke="url(#brandGrad)" stroke-width="4" opacity="0.25"/>
  <circle cx="256" cy="256" r="65" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.12"/>

  <!-- Agent nodes -->
  <circle cx="80" cy="140" r="8" fill="#00D4AA" opacity="0.5"/>
  <circle cx="150" cy="180" r="6" fill="#00D4AA" opacity="0.35"/>
  <circle cx="160" cy="350" r="8" fill="#00D4AA" opacity="0.5"/>
  <circle cx="340" cy="160" r="7" fill="#00D4AA" opacity="0.4"/>
  <circle cx="370" cy="360" r="6" fill="#00D4AA" opacity="0.35"/>
  <circle cx="100" cy="370" r="6" fill="#00D4AA" opacity="0.3"/>
  <circle cx="420" cy="200" r="6" fill="#00D4AA" opacity="0.3"/>
</svg>
