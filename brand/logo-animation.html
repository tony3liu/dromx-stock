<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingAgents — Brand Animation</title>
<style>
  :root {
    --cyan: #00D4AA;
    --amber: #F59E0B;
    --dark: #111827;
    --light: #F9FAFB;
    --green: #10B981;
    --red: #EF4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--light);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* ── Canvas Background ── */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.3;
  }

  /* ── Content Layer ── */
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
  }

  /* ── Logo Container ── */
  .logo-container {
    position: relative;
    display: inline-block;
    margin-bottom: 2rem;
  }

  #logo-canvas {
    display: block;
    width: 200px;
    height: 200px;
  }

  /* ── Typography ── */
  .brand-name {
    font-size: 3.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--cyan), #34D399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  .tagline {
    font-size: 1.25rem;
    color: #9CA3AF;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ── Variation Gallery ── */
  .variations {
    display: flex;
    gap: 2rem;
    margin-top: 4rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .variation-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    width: 180px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .variation-card:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--cyan);
    transform: translateY(-4px);
  }

  .variation-card canvas {
    width: 120px;
    height: 120px;
    margin: 0 auto;
    display: block;
  }

  .variation-card .label {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #9CA3AF;
    font-weight: 500;
  }

  .variation-card.active {
    border-color: var(--cyan);
    background: rgba(0, 212, 170, 0.1);
  }

  .variation-card.active .label {
    color: var(--cyan);
  }

  /* ── Info Section ── */
  .info {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: #6B7280;
  }

  .info code {
    background: rgba(255,255,255,0.1);
    padding: 0.2em 0.5em;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan);
  }

  /* ── Color Swatches ── */
  .swatches {
    display: flex;
    gap: 0.75rem;
    margin-top: 2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .swatch {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .swatch-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }

  .swatch-label {
    font-size: 0.75rem;
    color: #9CA3AF;
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="content">
  <!-- Animated Logo -->
  <div class="logo-container">
    <canvas id="logo-canvas"></canvas>
  </div>

  <!-- Brand Name -->
  <h1 class="brand-name">TradingAgents</h1>
  <p class="tagline">Your AI Research Desk</p>

  <!-- Variation Gallery -->
  <div class="variations" id="variations">
    <div class="variation-card active" data-anim="fourier">
      <canvas id="var-fourier"></canvas>
      <div class="label">Fourier Flow</div>
      <div style="font-size:0.7rem;color:#6B7280;margin-top:0.25rem">Hero / Brand</div>
    </div>
    <div class="variation-card" data-anim="rose">
      <canvas id="var-rose"></canvas>
      <div class="label">Rose Orbit</div>
      <div style="font-size:0.7rem;color:#6B7280;margin-top:0.25rem">Loading</div>
    </div>
    <div class="variation-card" data-anim="thinking">
      <canvas id="var-thinking"></canvas>
      <div class="label">Thinking Five</div>
      <div style="font-size:0.7rem;color:#6B7280;margin-top:0.25rem">Agent Thinking</div>
    </div>
    <div class="variation-card" data-anim="cardioid">
      <canvas id="var-cardioid"></canvas>
      <div class="label">Cardioid Heart</div>
      <div style="font-size:0.7rem;color:#6B7280;margin-top:0.25rem">Success</div>
    </div>
    <div class="variation-card" data-anim="spiral">
      <canvas id="var-spiral"></canvas>
      <div class="label">3-Petal Spiral</div>
      <div style="font-size:0.7rem;color:#6B7280;margin-top:0.25rem">Analyzing</div>
    </div>
  </div>

  <!-- Color Swatches -->
  <div class="swatches">
    <div class="swatch"><span class="swatch-dot" style="background:var(--cyan)"></span><span class="swatch-label">#00D4AA Cyan</span></div>
    <div class="swatch"><span class="swatch-dot" style="background:var(--amber)"></span><span class="swatch-label">#F59E0B Amber</span></div>
    <div class="swatch"><span class="swatch-dot" style="background:var(--green)"></span><span class="swatch-label">#10B981 Green</span></div>
    <div class="swatch"><span class="swatch-dot" style="background:var(--red)"></span><span class="swatch-label">#EF4444 Red</span></div>
    <div class="swatch"><span class="swatch-dot" style="background:var(--dark)"></span><span class="swatch-label">#111827 Dark</span></div>
  </div>

  <div class="info">
    Powered by <code>math-curve-loaders</code> · TradingAgents v1.0 Brand System
  </div>
</div>

<script>
// ============================================================================
// Math Curve Animation Engine
// ============================================================================

const CYAN = '#00D4AA';
const CYAN_DIM = 'rgba(0, 212, 170, 0.15)';
const AMBER = '#F59E0B';
const GREEN = '#10B981';
const RED = '#EF4444';

/**
 * Fourier Flow — multi-sine convergence
 * Metaphor: multiple analysts' signals converging into one decision
 */
function animFourierFlow(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const amplitudes = [0.3, 0.22, 0.16, 0.1, 0.06];
  const frequencies = [1, 1.5, 2.3, 3.1, 4.5];
  const phaseOffsets = [0, Math.PI / 3, Math.PI * 0.7, Math.PI * 0.4, Math.PI * 0.9];
  const trailLen = 18;
  const trails = amplitudes.map(() => []);
  let t = 0;

  function draw() {
    ctx.fillStyle = 'rgba(17, 24, 39, 0.12)';
    ctx.fillRect(0, 0, W, H);

    const radius = Math.min(W, H) * 0.35;

    for (let i = 0; i < amplitudes.length; i++) {
      const x = cx + Math.cos(t * frequencies[i] + phaseOffsets[i]) * radius * amplitudes[i] * 4 +
                Math.cos(t * 0.7 + i) * radius * 0.25;
      const y = cy + Math.sin(t * frequencies[i] + phaseOffsets[i]) * radius * amplitudes[i] * 4 +
                Math.sin(t * 0.6 + i * 1.2) * radius * 0.25;

      trails[i].push({ x, y });
      if (trails[i].length > trailLen) trails[i].shift();

      for (let j = 1; j < trails[i].length; j++) {
        const p = trails[i][j];
        const prev = trails[i][j - 1];
        const alpha = (j / trails[i].length) * 0.6;
        const hue = i / amplitudes.length;
        const color = lerpColor(CYAN, '#34D399', hue);
        ctx.strokeStyle = hexToRgba(color, alpha);
        ctx.lineWidth = 1.5 + (j / trails[i].length) * 1.5;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      // Glow dot at tip
      if (trails[i].length > 0) {
        const tip = trails[i][trails[i].length - 1];
        const color = lerpColor(CYAN, '#34D399', i / amplitudes.length);
        ctx.fillStyle = hexToRgba(color, 0.8);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = hexToRgba(color, 0.25);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    t += 0.012;
    requestAnimationFrame(draw);
  }

  draw();
}

/**
 * Rose Orbit — petal-shaped loading spinner
 * Metaphor: systematic analysis orbiting around a core thesis
 */
function animRoseOrbit(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const trailLen = 40;
  const trail = [];
  let t = 0;

  function draw() {
    ctx.fillStyle = 'rgba(17, 24, 39, 0.18)';
    ctx.fillRect(0, 0, W, H);

    const R = Math.min(W, H) * 0.32;
    const k = 3;  // 3 petals

    const r = R * Math.cos(k * t);
    const x = cx + r * Math.cos(t);
    const y = cy + r * Math.sin(t);

    trail.push({ x, y });
    if (trail.length > trailLen) trail.shift();

    for (let i = 1; i < trail.length; i++) {
      const p = trail[i];
      const prev = trail[i - 1];
      const alpha = (i / trail.length) * 0.5;
      ctx.strokeStyle = hexToRgba(CYAN, alpha);
      ctx.lineWidth = 1 + (i / trail.length) * 2.5;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    // Current point glow
    ctx.fillStyle = hexToRgba(CYAN, 0.9);
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hexToRgba(CYAN, 0.2);
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();

    t += 0.025;
    requestAnimationFrame(draw);
  }

  draw();
}

/**
 * Thinking Five — pulsing node cluster
 * Metaphor: 5 agents simultaneously thinking
 */
function animThinkingFive(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const numDots = 5;
  const radius = Math.min(W, H) * 0.25;
  let t = 0;

  const dots = [];
  for (let i = 0; i < numDots; i++) {
    dots.push({
      angle: (i / numDots) * Math.PI * 2,
      phase: (i / numDots) * Math.PI * 2
    });
  }

  function draw() {
    ctx.fillStyle = 'rgba(17, 24, 39, 0.25)';
    ctx.fillRect(0, 0, W, H);

    for (const dot of dots) {
      const pulse = Math.sin(t * 1.5 + dot.phase) * 0.5 + 0.5;
      const dist = radius * (0.5 + pulse * 0.5);
      const x = cx + Math.cos(dot.angle + t * 0.3) * dist;
      const y = cy + Math.sin(dot.angle + t * 0.3) * dist;
      const size = 2.5 + pulse * 4;

      // Glow
      ctx.fillStyle = hexToRgba(AMBER, 0.15);
      ctx.beginPath();
      ctx.arc(x, y, size * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = hexToRgba(AMBER, 0.3 + pulse * 0.5);
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Connecting lines (faint)
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const a = dots[i], b = dots[j];
        const ax = cx + Math.cos(a.angle + t * 0.3) * radius * (0.5 + (Math.sin(t * 1.5 + a.phase) * 0.5 + 0.5) * 0.5);
        const ay = cy + Math.sin(a.angle + t * 0.3) * radius * (0.5 + (Math.sin(t * 1.5 + a.phase) * 0.5 + 0.5) * 0.5);
        const bx = cx + Math.cos(b.angle + t * 0.3) * radius * (0.5 + (Math.sin(t * 1.5 + b.phase) * 0.5 + 0.5) * 0.5);
        const by = cy + Math.sin(b.angle + t * 0.3) * radius * (0.5 + (Math.sin(t * 1.5 + b.phase) * 0.5 + 0.5) * 0.5);
        ctx.strokeStyle = hexToRgba(AMBER, 0.08);
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }

    t += 0.02;
    requestAnimationFrame(draw);
  }

  draw();
}

/**
 * Cardioid Heart — heart-shaped pulse
 * Metaphor: analysis complete, decision ready
 */
function animCardioidHeart(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const trailLen = 50;
  const trail = [];
  let t = 0;

  function draw() {
    ctx.fillStyle = 'rgba(17, 24, 39, 0.15)';
    ctx.fillRect(0, 0, W, H);

    const scale = Math.min(W, H) * 0.15;
    const x = cx + scale * 16 * Math.pow(Math.sin(t), 3);
    const y = cy - scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

    trail.push({ x, y });
    if (trail.length > trailLen) trail.shift();

    for (let i = 1; i < trail.length; i++) {
      const p = trail[i];
      const prev = trail[i - 1];
      const alpha = (i / trail.length) * 0.5;
      ctx.strokeStyle = hexToRgba(GREEN, alpha);
      ctx.lineWidth = 1 + (i / trail.length) * 3;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    ctx.fillStyle = hexToRgba(GREEN, 0.9);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hexToRgba(GREEN, 0.25);
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fill();

    t += 0.02;
    requestAnimationFrame(draw);
  }

  draw();
}

/**
 * 3-Petal Spiral — rotating analysis pattern
 * Metaphor: structured, systematic exploration
 */
function animThreePetal(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const trailLen = 60;
  const trails = [[], [], []];
  let t = 0;

  function draw() {
    ctx.fillStyle = 'rgba(17, 24, 39, 0.15)';
    ctx.fillRect(0, 0, W, H);

    const R = Math.min(W, H) * 0.3;

    for (let p = 0; p < 3; p++) {
      const phase = (p / 3) * Math.PI * 2;
      const r = R * (0.3 + 0.7 * Math.abs(Math.cos(1.5 * t + phase)));
      const x = cx + r * Math.cos(t + phase);
      const y = cy + r * Math.sin(t + phase);

      trails[p].push({ x, y });
      if (trails[p].length > trailLen) trails[p].shift();

      for (let i = 1; i < trails[p].length; i++) {
        const pt = trails[p][i];
        const prev = trails[p][i - 1];
        const alpha = (i / trails[p].length) * 0.4;
        const hue = p / 3;
        const color = lerpColor(CYAN, '#6EE7B7', hue);
        ctx.strokeStyle = hexToRgba(color, alpha);
        ctx.lineWidth = 1 + (i / trails[p].length) * 2;
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();
      }

      if (trails[p].length > 0) {
        const tip = trails[p][trails[p].length - 1];
        const color = lerpColor(CYAN, '#6EE7B7', p / 3);
        ctx.fillStyle = hexToRgba(color, 0.8);
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    t += 0.018;
    requestAnimationFrame(draw);
  }

  draw();
}

/**
 * Background — subtle Fourier Flow
 */
function animBackground(canvas) {
  const ctx = canvas.getContext('2d');
  let t = 0;

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < 3; i++) {
      const amp = H * 0.25;
      const freq = 0.003 + i * 0.001;
      const phase = i * Math.PI * 0.7;
      ctx.strokeStyle = hexToRgba(CYAN, 0.06);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < W; x += 2) {
        const y = H / 2 + Math.sin(x * freq + t + phase) * amp * (0.5 + i * 0.25);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    t += 0.003;
    requestAnimationFrame(draw);
  }

  draw();
}

// ============================================================================
// Utilities
// ============================================================================

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1, 3), 16);
  const ag = parseInt(a.slice(3, 5), 16);
  const ab = parseInt(a.slice(5, 7), 16);
  const br = parseInt(b.slice(1, 3), 16);
  const bg = parseInt(b.slice(3, 5), 16);
  const bb = parseInt(b.slice(5, 7), 16);
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${bl.toString(16).padStart(2, '0')}`;
}

function setupCanvas(canvas, size) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  canvas.getContext('2d').scale(dpr, dpr);
}

// ============================================================================
// Initialize
// ============================================================================

const bgCanvas = document.getElementById('bg-canvas');
bgCanvas.width = window.innerWidth;
bgCanvas.height = window.innerHeight;
animBackground(bgCanvas);

const logoCanvas = document.getElementById('logo-canvas');
setupCanvas(logoCanvas, 200);
animFourierFlow(logoCanvas);

// Init variation canvases
const variations = {
  fourier: { el: document.getElementById('var-fourier'), fn: animFourierFlow },
  rose: { el: document.getElementById('var-rose'), fn: animRoseOrbit },
  thinking: { el: document.getElementById('var-thinking'), fn: animThinkingFive },
  cardioid: { el: document.getElementById('var-cardioid'), fn: animCardioidHeart },
  spiral: { el: document.getElementById('var-spiral'), fn: animThreePetal },
};

for (const [key, { el }] of Object.entries(variations)) {
  setupCanvas(el, 120);
}

// Start all variation animations
for (const [, { el, fn }] of Object.entries(variations)) {
  fn(el);
}

// Click to change main logo
document.getElementById('variations').addEventListener('click', (e) => {
  const card = e.target.closest('.variation-card');
  if (!card) return;
  const anim = card.dataset.anim;
  if (!anim || !variations[anim]) return;

  // Update active state
  document.querySelectorAll('.variation-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');

  // Swap main logo animation
  const newCanvas = logoCanvas.cloneNode(true);
  logoCanvas.parentNode.replaceChild(newCanvas, logoCanvas);
  newCanvas.id = 'logo-canvas';
  setupCanvas(newCanvas, 200);
  variations[anim].fn(newCanvas);
});

// Handle resize
window.addEventListener('resize', () => {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
});
</script>

</body>
</html>
