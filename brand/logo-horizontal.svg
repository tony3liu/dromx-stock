<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Icon: Three converging signals → center decision point -->
  <!-- Signal 1 (top wave) -->
  <path d="M40,100 Q70,60 100,100 T160,100 T220,100"
        fill="none" stroke="url(#brandGrad)" stroke-width="4"
        stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Signal 2 (middle wave - stronger) -->
  <path d="M30,100 Q70,130 110,100 T180,100 T240,100"
        fill="none" stroke="url(#brandGrad)" stroke-width="5"
        stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Signal 3 (bottom wave) -->
  <path d="M40,100 Q80,80 120,100 T190,100 T250,100"
        fill="none" stroke="url(#brandGrad)" stroke-width="3"
        stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Center decision dot -->
  <circle cx="145" cy="100" r="8" fill="url(#brandGrad)" opacity="0.9"/>
  <circle cx="145" cy="100" r="16" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="145" cy="100" r="24" fill="none" stroke="url(#brandGrad)" stroke-width="1" opacity="0.15"/>

  <!-- Small agent dots around the center -->
  <circle cx="45" cy="60" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="75" cy="80" r="3" fill="#00D4AA" opacity="0.4"/>
  <circle cx="80" cy="130" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="110" cy="70" r="3" fill="#00D4AA" opacity="0.5"/>
  <circle cx="55" cy="140" r="3" fill="#00D4AA" opacity="0.4"/>

  <!-- Text: TRADING -->
  <text x="280" y="95" font-family="Inter, -apple-system, sans-serif"
        font-size="56" font-weight="800" letter-spacing="-1"
        fill="#F9FAFB">
    TRADING
  </text>

  <!-- Text: AGENTS -->
  <text x="280" y="155" font-family="Inter, -apple-system, sans-serif"
        font-size="48" font-weight="700" letter-spacing="3"
        fill="url(#brandGrad)">
    AGENTS
  </text>

  <!-- Tagline -->
  <text x="281" y="180" font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="400" letter-spacing="1.5"
        fill="#6B7280">
    YOUR AI RESEARCH DESK
  </text>
</svg>
